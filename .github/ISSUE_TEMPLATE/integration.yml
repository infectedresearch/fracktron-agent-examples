name: Integration feedback
description: Tell us what task failed or was confusing—without secrets.
title: "Integration: "
body:
  - type: markdown
    attributes:
      value: "This issue is PUBLIC. Do not include cookies, tokens, private URLs, messages or request headers. Report security issues privately; see SECURITY.md."
  - type: textarea
    id: task
    attributes:
      label: What public-data task were you trying to accomplish?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version, client and HTTP or MCP transport
  - type: textarea
    id: observed
    attributes:
      label: Expected versus actual result
      description: Include only sanitized errors or synthetic examples. How did you find the integration, if you want to share?
    validations:
      required: true
